<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Business</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>
<p id="demo" class="demo hidden"></p>
<header class="nav"><div class="wrap nav-in"><strong id="brand"></strong><a id="navCall" class="btn small"></a></div></header>
<section class="hero" id="hero"><div class="wrap">
  <p class="eyebrow" id="type"></p><h1 id="name"></h1><p class="tagline" id="tagline"></p>
  <div class="cta" id="cta"></div>
</div></section>
<section class="wrap sec"><h2>Services</h2><div class="grid" id="services"></div></section>
<section class="wrap sec"><h2>What customers say</h2><div class="grid" id="reviews"></div></section>
<section class="wrap sec two">
  <div><h2>Hours</h2><table id="hours"></table><h2>Contact</h2><p id="contact"></p></div>
  <div class="map"><iframe id="map" title="Map" loading="lazy"></iframe></div>
</section>
<footer class="wrap foot"><div id="socials"></div><p class="muted small">© <span id="yr"></span> <span id="fname"></span>. Site by <a href="https://kshot3000.github.io/Kshot-Apps-Dapps-Websites/">Kshot Applications</a>.</p></footer>
<script src="app.js"></script>
</body>
</html>
