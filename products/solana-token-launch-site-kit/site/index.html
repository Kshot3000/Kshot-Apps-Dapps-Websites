<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Find-and-replace these placeholders here too (search engines and link previews read them before JavaScript runs). -->
<title>{{TOKEN_NAME}} (${{TICKER}})</title>
<meta name="description" content="{{TAGLINE}}">
<meta property="og:title" content="{{TOKEN_NAME}} (${{TICKER}})">
<meta property="og:description" content="{{TAGLINE}}">
<meta property="og:image" content="{{SITE_URL}}/logo.svg">
<meta name="twitter:card" content="summary">
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>
<p id="setup" class="setup hidden" role="status"></p>
<header class="hero">
  <img id="logo" src="logo.svg" alt="" width="120" height="120">
  <h1 id="name"></h1>
  <p class="ticker" id="ticker"></p>
  <p class="tagline" id="tagline"></p>
  <div class="ca">
    <code id="mint"></code>
    <button id="copy" class="btn small" type="button">Copy CA</button>
  </div>
  <div class="links" id="buy"></div>
</header>
<main>
<section id="chartSec" class="hidden"><h2>Live chart</h2><div class="chart"><iframe id="chart" title="Live chart" loading="lazy"></iframe></div></section>
<section id="swapSec" class="hidden"><h2>Buy now</h2><p class="muted center">Connect your wallet and swap SOL right here.</p><div id="jupiter-plugin" class="swap"></div></section>
<section><h2>Tokenomics</h2><div class="grid" id="tokenomics"></div></section>
<section><h2>How to buy</h2><ol id="howto"></ol></section>
<section><h2>Roadmap</h2><div class="grid" id="roadmap"></div></section>
</main>
<footer>
  <div class="links" id="socials"></div>
  <p id="payLink" class="hidden"><a class="btn ghost small" href="pay/">Pay with SOL or USDC</a></p>
  <p class="muted small" id="disclaimer"></p>
  <p class="muted small" id="credit"></p>
</footer>
<script src="app.js"></script>
</body>
</html>
